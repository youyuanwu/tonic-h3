[package]
name = "axum-h3"
version = "0.0.6"
edition.workspace = true
license = "MIT"
authors = ["youyuanwu@outlook.com"]
repository = "https://github.com/youyuanwu/tonic-h3"
description = "HTTP/3 for axum"
categories = ["web-programming", "network-programming"]
keywords = ["axum", "h3"]
readme = "README.md"

[lib]
test = false

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros"] }
h3-util.workspace = true
hyper-util.workspace = true
tracing.workspace = true
tower.workspace = true
h3.workspace = true
hyper.workspace = true
futures.workspace = true

[dev-dependencies]
h3-util = { workspace = true, features = ["quinn"] }
quinn = { workspace = true, default-features = false, features = ["aws-lc-rs", "rustls-aws-lc-rs", "runtime-tokio"] }
rcgen.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true