name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.read.outputs.channel }}
    steps:
    - uses: actions/checkout@v7
    - name: Read rust channel from rust-toolchain.toml
      id: read
      run: |
        channel=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

  build:
    needs: toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        # 1.90.0 is the MSRV; the second entry is the pinned toolchain read
        # from rust-toolchain.toml by the `toolchain` job.
        rust: [ "1.90.0", "${{ needs.toolchain.outputs.channel }}" ]
      fail-fast: false
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CMAKE_C_COMPILER_LAUNCHER: "sccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "sccache"

    steps:
    - uses: actions/checkout@v7

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.10.0"

    # choose a older version to avoid apt error
    - name: Install msquic from apt (linux)
      if: runner.os == 'Linux'
      run: |
        wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb;
        sudo dpkg -i packages-microsoft-prod.deb;
        sudo apt-get update;
        sudo apt-get install libmsquic=2.4.8;
        dpkg -L libmsquic;

    - name: Run Vcpkg (windows)
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9 # 2026.02.27
      env:
        VCPKG_BINARY_SOURCES: default,rw

    - name: Set up vcpkg binary cache
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('vcpkg*.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-binary-cache-

    - name: vcpkg install (windows)
      if: runner.os == 'Windows'
      run: vcpkg install msquic

    - name: Use nasm from winget (for quiche boringssl)
      if: runner.os == 'Windows'
      run: winget install nasm --accept-package-agreements --accept-source-agreements --disable-interactivity

    - name: Remove toolchain file to avoid conflict with rust cache.
      run: rm rust-toolchain.toml

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy, llvm-tools

    - name: Run Rust cache
      uses: Swatinem/rust-cache@v2

    - uses: taiki-e/install-action@protoc

    - uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run cargo check
      run: cargo +${{ matrix.rust }} check --locked --all-targets

    - name: Run cargo fmt
      run: cargo +${{ matrix.rust }} fmt --all -- --check
    
    - name: Run cargo clippy
      run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.x'
    
    - name: dotnet build
      run: dotnet build

    - name: cargo build all (needed for example tests)
      run: cargo +${{ matrix.rust }} build --locked --all-targets

    - name: run all rust unittests
      run: cargo +${{ matrix.rust }} test --locked --all-targets

    - name: run rust doctests
      run: cargo +${{ matrix.rust }} test --locked --workspace --doc

    - name: check crate packaging
      run: cargo +${{ matrix.rust }} package --locked -p tonic-h3 -p h3-util -p h3-util -p axum-h3 --allow-dirty

    - name: Run llvm-cov
      run: cargo +${{ matrix.rust }} llvm-cov --locked --codecov --output-path codecov.json --ignore-filename-regex "tonic-h3-tests.*|external.*" --features llvm-cov-mode

    - name: Show cov summary
      run: cargo +${{ matrix.rust }} llvm-cov report --locked --summary-only --ignore-filename-regex "tonic-h3-tests.*|external.*"

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      # Expose the token via env so it is picked up on both regular and
      # Dependabot runs. For Dependabot PRs this requires CODECOV_TOKEN to be
      # added as a Dependabot secret (Settings > Secrets and variables >
      # Dependabot); otherwise it is empty there.
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        files: ./codecov.json
        # Only fail CI on upload errors when a token is available, so Dependabot
        # PRs without the secret configured don't break the build.
        fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}