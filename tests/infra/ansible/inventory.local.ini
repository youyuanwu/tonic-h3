# Loopback inventory for validating run-bench.yml WITHOUT Azure.
#
# Both logical roles resolve to the local machine (ansible_connection=local) and
# target 127.0.0.1, so the start-server -> wait-ready -> run-client -> capture ->
# fetch -> stop-server flow can be exercised end-to-end on a single host using
# the already-built release binaries. See docs/bench/run-procedure.md.
#
# Example (run from tests/infra/ansible/):
#   cargo build --release -p tonic-h3-bench   # from the repo root
#   ansible-playbook -i inventory.local.ini run-bench.yml \
#     -e bench_dest_dir="{{ playbook_dir }}/../../../target/release" \
#     -e bench_results_dir_remote=/tmp/bench-dryrun \
#     -e topology=loopback -e vm_size=local -e region=local \
#     -e '{"scenarios":[{"transport":"quinn","payload_size":64,"concurrency":1,"count":20,"port":5051},{"transport":"tcp-tls","payload_size":64,"concurrency":1,"count":20,"port":5052}]}'
[bench]
client ansible_connection=local ansible_host=127.0.0.1 private_ip=127.0.0.1 peer=server vm_name=localhost-client
server ansible_connection=local ansible_host=127.0.0.1 private_ip=127.0.0.1 peer=client vm_name=localhost-server

[bench:vars]
ansible_python_interpreter={{ ansible_playbook_python }}
