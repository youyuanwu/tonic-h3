---
# Deploy the tonic-h3 benchmark binaries + libmsquic runtime to both VMs.
#
# Copies the locally built RELEASE binaries (`bench-server`, `bench-client`)
# from the control node onto both the `client` and `server` hosts, installs the
# native `libmsquic` runtime the binaries link against, and verifies each binary
# actually runs on the VM (a `--help` smoke test that also proves
# `libmsquic.so.2` loads).
#
# Prerequisites:
#   * Release binaries built on a glibc COMPATIBLE with the VMs (Ubuntu 22.04).
#     Build them on the control node with:
#         cargo build --release -p tonic-h3-bench
#     The control host in this repo is glibc-compatible with Ubuntu 22.04. If
#     yours is not, either build on a 22.04 box/container, or use the
#     build-on-VM fallback documented in docs/bench/run-procedure.md.
#   * Inventory generated by inventory.py (hosts client/server).
#
# Usage (run from tests/infra/ansible/ so ansible.cfg is active):
#   python3 inventory.py --topology same-zone
#   ansible-playbook deploy-bench.yml
#   # override the binary source or destination:
#   ansible-playbook deploy-bench.yml -e bench_bin_dir=/path/to/target/release
#   ansible-playbook deploy-bench.yml -e bench_dest_dir=/usr/local/bin -e ansible_become=true
#   # pin/override the libmsquic version (empty string = latest available):
#   ansible-playbook deploy-bench.yml -e bench_libmsquic_version=2.4.8
- name: Deploy benchmark binaries and libmsquic runtime
  hosts: bench
  gather_facts: true
  vars:
    # Source dir on the CONTROL node holding the release binaries.
    bench_bin_dir: "{{ playbook_dir }}/../../../target/release"
    # Destination dir on the VMs. Defaults to ~/bench (no root needed).
    bench_dest_dir: "{{ ansible_env.HOME }}/bench"
    # libmsquic apt version to pin. Matches the version proven in repo CI.
    # Set to "" (empty) to install the latest available package.
    bench_libmsquic_version: "2.4.8"
    # Ubuntu release used for the packages.microsoft.com repo path.
    bench_ubuntu_release: "{{ ansible_distribution_version | default('22.04') }}"
    bench_binaries:
      - bench-server
      - bench-client
  tasks:
    - name: Assert the release binaries exist on the control node
      ansible.builtin.stat:
        path: "{{ bench_bin_dir }}/{{ item }}"
      loop: "{{ bench_binaries }}"
      delegate_to: localhost
      run_once: true
      register: bench_src_stat
      failed_when: not bench_src_stat.stat.exists

    - name: Ensure the destination directory exists
      ansible.builtin.file:
        path: "{{ bench_dest_dir }}"
        state: directory
        mode: "0755"

    - name: Download the packages.microsoft.com apt repository config
      become: true
      ansible.builtin.get_url:
        url: "https://packages.microsoft.com/config/ubuntu/{{ bench_ubuntu_release }}/packages-microsoft-prod.deb"
        dest: /tmp/packages-microsoft-prod.deb
        mode: "0644"

    - name: Install the Microsoft apt repository config
      become: true
      ansible.builtin.apt:
        deb: /tmp/packages-microsoft-prod.deb

    - name: Install the libmsquic runtime
      become: true
      ansible.builtin.apt:
        name: "libmsquic{{ ('=' + bench_libmsquic_version) if bench_libmsquic_version else '' }}"
        state: present
        update_cache: true

    - name: Copy the benchmark binaries to the VMs
      ansible.builtin.copy:
        src: "{{ bench_bin_dir }}/{{ item }}"
        dest: "{{ bench_dest_dir }}/{{ item }}"
        mode: "0755"
      loop: "{{ bench_binaries }}"

    - name: Verify each binary runs on the VM (loads libmsquic.so.2)
      ansible.builtin.command:
        cmd: "{{ bench_dest_dir }}/{{ item }} --help"
      register: bench_help
      changed_when: false
      failed_when: bench_help.rc != 0
      loop: "{{ bench_binaries }}"

    - name: Summarize deployment
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ vm_name | default('?') }}):
          deployed bench-server + bench-client to {{ bench_dest_dir }},
          libmsquic installed, --help smoke test passed.
