---
# Peer connectivity test for a deployed tonic-h3 benchmark scenario.
#
# For each node, ICMP-ping the PEER node over its PRIVATE IP, proving that the
# Azure internal path works (same subnet, cross-zone, or global VNet peering)
# without touching the public internet. The default Azure `AllowVnetInBound`
# rule permits intra-VNet / peered ICMP, so a successful ping confirms private
# connectivity end to end.
#
# Prerequisites:
#   * ansible-core installed on the control node.
#   * Inventory generated by inventory.py (hosts client/server, each with
#     private_ip and peer vars).
#
# Usage:
#   python3 inventory.py --topology cross-region
#   ansible-playbook ping.yml            # ansible.cfg points at ./inventory.ini
#   # or explicitly:
#   ansible-playbook -i inventory.ini ping.yml
- name: Peer connectivity test over private IPs
  hosts: bench
  gather_facts: false
  vars:
    ping_count: 4
    ping_timeout: 2
  tasks:
    - name: Resolve the peer's private IP
      ansible.builtin.set_fact:
        peer_private_ip: "{{ hostvars[peer].private_ip }}"

    - name: "ICMP ping {{ inventory_hostname }} ({{ private_ip }}) -> {{ peer }} ({{ peer_private_ip }})"
      ansible.builtin.command:
        cmd: "ping -c {{ ping_count }} -W {{ ping_timeout }} {{ peer_private_ip }}"
      register: ping_result
      changed_when: false
      failed_when: ping_result.rc != 0

    - name: Summarize reachability
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ private_ip }}) ->
          {{ peer }} ({{ peer_private_ip }}): PRIVATE PATH REACHABLE
